<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Manga Voice</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">

    <!-- JSZip (para abrir .cbz/.zip al importar capítulos) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="logo">
                <span>Manga Voice</span>
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="settingsBtn" title="Configurar GitHub">
                    <i class="fas fa-gear"></i>
                </button>
                <button class="btn-icon" id="themeToggle" title="Cambiar tema">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- ===== BARRA DE ESTADO COMPARTIDA ===== -->
        <div class="status-bar" id="statusBar" style="display:none;">
            <div class="status-icon"><i class="fas fa-info-circle"></i></div>
            <div class="status-text" id="statusText"></div>
        </div>

        <!-- ===== PANTALLA: BIBLIOTECA ===== -->
        <main class="main-content" id="libraryScreen">
            <div class="hero">
                <h1>Manga Voice</h1>
                <p>Tu biblioteca de manga, compartida entre tus dispositivos.</p>
            </div>

            <div class="import-section">
                <button class="btn-import" id="createMangaBtn" type="button">
                    <i class="fas fa-folder-plus"></i>
                    <span>Nuevo Manga</span>
                    <small>crea una carpeta con su nombre</small>
                </button>
            </div>

            <div class="library-section">
                <div class="library-header">
                    <h2><i class="fas fa-book"></i> Tu Biblioteca</h2>
                </div>
                <div class="manga-grid" id="mangaGrid"></div>
            </div>
        </main>

        <!-- ===== PANTALLA: CARPETA DE UN MANGA (capítulos) ===== -->
        <main class="folder-screen" id="mangaScreen" style="display:none;">
            <div class="reader-toolbar">
                <button class="btn-back" id="backToLibraryFromFolder">
                    <i class="fas fa-arrow-left"></i>
                    <span class="btn-back-text">Biblioteca</span>
                </button>
                <div class="reader-title" id="mangaFolderTitle">Manga</div>
                <button class="btn-icon btn-delete" id="deleteMangaBtn" title="Eliminar manga">
                    <i class="fas fa-trash"></i>
                </button>
            </div>

            <div class="folder-content">
                <div class="import-section">
                    <label class="btn-import" for="chapterFileInput">
                        <i class="fas fa-folder-open"></i>
                        <span>Importar Capítulo</span>
                        <small>.cbz, .zip o imágenes sueltas</small>
                    </label>
                    <input type="file" id="chapterFileInput" accept=".zip,.cbz,.cbr,image/*" multiple>
                </div>

                <div class="chapter-list" id="chapterList"></div>
            </div>
        </main>

        <!-- ===== PANTALLA: LECTOR ===== -->
        <main class="main-content reader-screen" id="readerScreen" style="display:none;">
            <div class="reader-toolbar">
                <button class="btn-back" id="backToFolder">
                    <i class="fas fa-arrow-left"></i>
                    <span class="btn-back-text">Capítulos</span>
                </button>
                <div class="reader-title" id="readerTitle">Manga</div>
                <div class="reader-page-info" id="pageInfo">1 / 1</div>
            </div>

            <div class="reader-layout">
                <div class="viewer-panel">
                    <div class="manga-viewport" id="mangaViewport">
                        <img id="mangaImage" src="" alt="Página de manga">

                        <button class="nav-btn nav-prev" id="navPrev" title="Anterior">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="nav-btn nav-next" id="navNext" title="Siguiente">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>

                    <div class="page-progress">
                        <input type="range" id="pageSlider" min="0" max="0" value="0">
                        <div class="page-thumbnails" id="pageThumbnails"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <p>Manga Voice</p>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
